<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>menuve</title>
  <style>
    :root { --bg:#0f1220; --card:#181c30; --text:#eef0fa; --muted:#9aa0bd; --accent:#7c6cff; --listen:#2ecc9a; --busy:#ffb347; --off:#3a3f5c; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; }
    body { background: radial-gradient(1000px 600px at 50% -10%, #1d2244 0%, var(--bg) 60%); color:var(--text);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display:flex; justify-content:center; }
    .app { width:100%; max-width:560px; min-height:100vh; padding:16px 16px 24px; display:flex; flex-direction:column; gap:18px; }
    h1 { margin:0; font-size:1.5rem; letter-spacing:.04em; }
    .stage { display:flex; flex-direction:column; align-items:center; gap:10px; padding:12px 0 4px; }
    .orb { width:132px; height:132px; border-radius:50%; border:0; cursor:pointer; color:#fff; background:var(--off);
           display:grid; place-items:center; transition:background .25s, transform .15s; position:relative; }
    .orb:active { transform:scale(.96); }
    .orb::after { content:""; position:absolute; inset:-10px; border-radius:50%; border:2px solid transparent; pointer-events:none; }
    .orb[data-state="waiting"] { background:var(--accent); }
    .orb[data-state="waiting"]::after { border-color:var(--accent); animation:pulse 2.4s ease-out infinite; }
    .orb[data-state="active"] { background:var(--listen); }
    .orb[data-state="active"]::after { border-color:var(--listen); animation:pulse 1.1s ease-out infinite; }
    .orb[data-state="processing"], .orb[data-state="speaking"] { background:var(--busy); }
    .orb[data-state="processing"]::after { border-color:var(--busy); animation:pulse .8s ease-out infinite; }
    @keyframes pulse { from { transform:scale(.9); opacity:.9; } to { transform:scale(1.35); opacity:0; } }
    .status { margin:6px 0 0; font-size:1.05rem; font-weight:600; }
    .timeout { width:160px; height:4px; border-radius:4px; background:#ffffff14; overflow:hidden; opacity:0; transition:opacity .2s; }
    .timeout.run { opacity:1; }
    .timeout span { display:block; height:100%; width:100%; background:var(--listen); transform-origin:left; }
    .timeout.run span { animation:shrink 15s linear forwards; }
    @keyframes shrink { to { transform:scaleX(0); } }
    .live { min-height:1.4em; margin:0; color:var(--muted); font-style:italic; text-align:center; }
    .switch { display:flex; align-items:center; gap:12px; justify-content:center; cursor:pointer; color:var(--muted); user-select:none; }
    .switch input { display:none; }
    .slider { width:44px; height:24px; border-radius:24px; background:var(--off); position:relative; transition:background .2s; }
    .slider::after { content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .2s; }
    .switch input:checked + .slider { background:var(--accent); }
    .switch input:checked + .slider::after { transform:translateX(20px); }
    .log { flex:1; display:flex; flex-direction:column; gap:10px; overflow-y:auto; padding:4px 2px; }
    .msg { max-width:86%; padding:10px 14px; border-radius:16px; line-height:1.4; word-wrap:break-word; }
    .msg.user { align-self:flex-end; background:var(--accent); border-bottom-right-radius:4px; }
    .msg.bot { align-self:flex-start; background:var(--card); border-bottom-left-radius:4px; }
    .msg.error { align-self:flex-start; background:#4a2030; color:#ffb7c5; border-bottom-left-radius:4px; }
    .text-form { display:flex; gap:8px; }
    .text-form input { flex:1; padding:12px 14px; border-radius:12px; border:1px solid #ffffff1c; background:var(--card); color:var(--text); font-size:1rem; }
    .text-form button { padding:12px 18px; border-radius:12px; border:0; font-size:1rem; cursor:pointer; background:var(--accent); color:#fff; }
    .support { color:var(--busy); text-align:center; font-size:.9rem; }
  </style>
</head>
<body>
  <main class="app">
    <h1>menuve</h1>

    <section class="stage">
      <button id="micBtn" class="orb" data-state="off" type="button" aria-label="Ativar ou desativar escuta manualmente">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path>
        </svg>
      </button>
      <p id="statusText" class="status" aria-live="polite">Inativo</p>
      <div id="timeoutWrap" class="timeout" aria-hidden="true"><span></span></div>
      <p id="liveText" class="live"></p>
    </section>

    <label class="switch">
      <input type="checkbox" id="keywordToggle">
      <span class="slider"></span>
      <span>Escutar a palavra “Menuve”</span>
    </label>

    <section id="log" class="log" aria-live="polite"></section>

    <form id="textForm" class="text-form" autocomplete="off">
      <input id="textInput" type="text" placeholder="Ou digite um comando…">
      <button type="submit">Enviar</button>
    </form>

    <p id="supportMsg" class="support" hidden>Seu navegador não suporta reconhecimento de voz. Use o Chrome ou o Edge — você ainda pode digitar comandos.</p>
  </main>

  <script>
  (function () {
    'use strict';

    // Cole aqui a URL do Web App (a que termina em /exec):
    var URL_DO_WEB_APP = 'https://script.google.com/macros/s/AKfycbwUuF8NqKTcpCch7gNdUPnfX07ZYKILrFGXYWJMrybenq0RjwSJsk6CVfnPn7I07SF1/exec';

    var INACTIVITY_MS = 15000;  // sem fala após ativar -> volta à espera
    var SILENCE_MS = 1800;      // pausa após o comando -> envia
    var WAKE_RE = /\bmenu\s?v[ei]?e?\b/;  // "menuve", "menu ve", "menuvi", "menuv"...

    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var $ = function (id) { return document.getElementById(id); };
    var el = { mic:$('micBtn'), status:$('statusText'), live:$('liveText'), timeout:$('timeoutWrap'),
               toggle:$('keywordToggle'), log:$('log'), form:$('textForm'), input:$('textInput'), support:$('supportMsg') };

    var STATUS_TEXT = { off:'Inativo', waiting:"Aguardando 'Menuve'...", active:'Ouvindo...', processing:'Processando...', speaking:'Falando...' };

    var rec = null, running = false, wantListening = false, keywordEnabled = false;
    var listenMode = 'waiting', manualActivation = false, wakeIndex = 0, busy = false;
    var inactivityTimer = null, silenceTimer = null, pendingCommand = '';

    function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }

    function setStatus(s) {
      el.status.textContent = STATUS_TEXT[s];
      el.mic.dataset.state = s;
      if (s !== 'active') el.live.textContent = '';
    }

    function addMessage(kind, text) {
      var d = document.createElement('div');
      d.className = 'msg ' + kind;
      d.textContent = text;
      el.log.appendChild(d);
      el.log.scrollTop = el.log.scrollHeight;
    }

    function startBar() { el.timeout.classList.remove('run'); void el.timeout.offsetWidth; el.timeout.classList.add('run'); }
    function stopBar() { el.timeout.classList.remove('run'); }
    function clearTimers() { clearTimeout(inactivityTimer); clearTimeout(silenceTimer); inactivityTimer = silenceTimer = null; stopBar(); }

    // ---------- Reconhecimento de voz ----------
    function setupRecognition() {
      rec = new SR();
      rec.lang = 'pt-BR';
      rec.continuous = true;
      rec.interimResults = true;
      rec.onstart = function () { running = true; };
      rec.onend = function () {
        running = false;
        if (wantListening && !busy) setTimeout(startRec, 250); // o Chrome encerra a escuta contínua de tempos em tempos
      };
      rec.onerror = function (e) {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          wantListening = false; clearTimers(); setStatus('off');
          el.toggle.checked = keywordEnabled = false;
          addMessage('error', 'Microfone bloqueado. Permita o acesso ao microfone. Se o bloqueio persistir dentro do Apps Script, abra a URL /exec em uma aba própria (ou hospede no GitHub Pages).');
        } else if (e.error === 'network') {
          addMessage('error', 'Erro de rede no reconhecimento de voz.');
        }
      };
      rec.onresult = onResult;
    }

    function startRec() { if (!wantListening || busy || running) return; try { rec.start(); } catch (_) {} }
    function restartRec() { if (running) { try { rec.abort(); } catch (_) {} } else startRec(); }
    function stopRec() { wantListening = false; try { rec.abort(); } catch (_) {} }

    function onResult(e) {
      if (busy) return;
      if (listenMode === 'waiting') {
        for (var i = e.resultIndex; i < e.results.length; i++) {
          if (WAKE_RE.test(norm(e.results[i][0].transcript))) { activate(false, i); handleActive(e); return; }
        }
        return;
      }
      handleActive(e);
    }

    function activate(manual, index) {
      listenMode = 'active'; manualActivation = manual; wakeIndex = index; pendingCommand = '';
      setStatus('active'); clearTimers();
      inactivityTimer = setTimeout(function () { deactivate('Nenhum comando detectado. Voltando ao modo de espera.'); }, INACTIVITY_MS);
      startBar();
    }

    function handleActive(e) {
      var raw = '';
      for (var i = wakeIndex; i < e.results.length; i++) raw += e.results[i][0].transcript + ' ';
      var cmd = raw;
      if (!manualActivation) {
        var m = WAKE_RE.exec(norm(raw));
        if (m) cmd = raw.slice(m.index + m[0].length);
      }
      cmd = cmd.replace(/^[\s,.:;!?\-]+/, '').trim();
      if (!cmd) return;               // só disse "Menuve" por ora; o timeout de 15s segue valendo
      clearTimeout(inactivityTimer); stopBar();
      pendingCommand = cmd; el.live.textContent = cmd;
      clearTimeout(silenceTimer);
      silenceTimer = setTimeout(function () { send(pendingCommand); }, SILENCE_MS);
    }

    function deactivate(message) {
      clearTimers(); pendingCommand = '';
      if (message) addMessage('bot', message);
      if (keywordEnabled) { listenMode = 'waiting'; wantListening = true; setStatus('waiting'); restartRec(); }
      else { stopRec(); setStatus('off'); }
    }

    // ---------- Backend (google.script.run) ----------
    function send(command) {
      command = (command || '').trim();
      if (!command || busy) return;
      busy = true; clearTimers();
      try { if (rec) rec.abort(); } catch (_) {}
      setStatus('processing');
      addMessage('user', command);

      // text/plain evita o preflight de CORS, que o Apps Script não aceita
      fetch(URL_DO_WEB_APP, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ command: command })
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var reply = (data && data.responseMessage) || 'Pronto.';
          addMessage(data && data.status === 'success' ? 'bot' : 'error', reply);
          speak(reply, finish);
        })
        .catch(function () {
          var reply = 'Não consegui falar com o servidor. Confira a URL do Web App.';
          addMessage('error', reply);
          speak(reply, finish);
        });
    }

    function finish() {
      busy = false;
      if (keywordEnabled) { listenMode = 'waiting'; wantListening = true; setStatus('waiting'); startRec(); }
      else { wantListening = false; setStatus('off'); }
    }

    // ---------- Síntese de voz ----------
    function speak(text, done) {
      if (!('speechSynthesis' in window)) { done(); return; }
      setStatus('speaking');
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'pt-BR';
      var voices = speechSynthesis.getVoices();
      var v = voices.filter(function (x) { return x.lang === 'pt-BR'; })[0] || voices.filter(function (x) { return x.lang.indexOf('pt') === 0; })[0];
      if (v) u.voice = v;
      var called = false, guard;
      function end() { if (!called) { called = true; clearTimeout(guard); done(); } }
      u.onend = end; u.onerror = end;
      guard = setTimeout(end, Math.max(6000, text.length * 120)); // alguns navegadores não disparam onend
      window.speechSynthesis.speak(u);
    }

    // ---------- Controles ----------
    el.mic.addEventListener('click', function () {
      if (!SR || busy) return;
      if (listenMode === 'active' && wantListening) { deactivate(); return; }
      wantListening = true; activate(true, 0); restartRec();
    });

    el.toggle.addEventListener('change', function () {
      if (!SR) { el.toggle.checked = false; return; }
      keywordEnabled = el.toggle.checked;
      if (busy) return;
      if (keywordEnabled) {
        if (listenMode !== 'active' || !wantListening) { listenMode = 'waiting'; wantListening = true; setStatus('waiting'); restartRec(); }
      } else if (listenMode === 'waiting') { stopRec(); setStatus('off'); }
    });

    el.form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var v = el.input.value.trim(); el.input.value = ''; send(v);
    });

    // ---------- Início ----------
    if (!SR) { el.support.hidden = false; el.mic.disabled = true; el.toggle.disabled = true; }
    else setupRecognition();
    if ('speechSynthesis' in window) speechSynthesis.getVoices();
    setStatus('off');
  })();
  </script>
</body>
</html>
